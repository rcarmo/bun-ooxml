name: office-oracles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  authored-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install independent rendering tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc poppler-utils
      - run: make install
      - run: make office-oracles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-oracles
          path: artifacts/office-oracles/
