name: check
on: [push, pull_request]
jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - run: make install
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance
          path: artifacts/acceptance.json
